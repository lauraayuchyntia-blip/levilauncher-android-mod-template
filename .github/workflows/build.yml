name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Kangetsu Lyrics patch from kangetsu.zip
        run: |
          unzip -q kangetsu.zip
          mkdir -p src/lyrics
          cp -r kangetsu/mod/src/lyrics/* src/lyrics/
          cp kangetsu/assets/lyrics.ttf .

          python3 - << 'EOF'
          import re

          # 1. Patch CMakeLists.txt
          cm = open("CMakeLists.txt").read()
          cm = cm.replace('set(MOD_ID "clange_me"', 'set(MOD_ID "kangetsu_lyrics_port"')
          cm = cm.replace('set(MOD_NAME "Clange Me Mod"', 'set(MOD_NAME "Kangetsu Lyrics (port)"')
          cm = cm.replace('set(MOD_LIBRARY_NAME "clange_me"', 'set(MOD_LIBRARY_NAME "kangetsu_lyrics_port"')
          cm = cm.replace('set(MOD_MINECRAFT_VERSIONS "[\\"1.26.*\\"]"', 'set(MOD_MINECRAFT_VERSIONS "[]"')
          cm = cm.replace("src/mod/MyMod.cpp", "src/mod/MyMod.cpp\n    src/lyrics/Engine.cpp")
          open("CMakeLists.txt", "w").write(cm)

          # 2. Patch src/mod/MyMod.cpp (indentasi 4 spasi sesuai file asli)
          mm = open("src/mod/MyMod.cpp").read()
          mm = '#include "../lyrics/Engine.hpp"\nnamespace { kl::Engine gLyrics; }\n' + mm
          old_enable = '    self.getLogger().info("Config message: {}", mConfig.message);\n    return true;'
          new_enable = '    self.getLogger().info("Config message: {}", mConfig.message);\n    return gLyrics.start(getSelf().getId(), getSelf().getResourceDir().string(), [this](const std::string& m) { getSelf().getLogger().info(m); });'
          assert old_enable in mm, "old_enable tidak ditemukan!"
          mm = mm.replace(old_enable, new_enable, 1)

          old_disable = '    // Undo enable-time state here.\n    return true;'
          new_disable = '    gLyrics.stop();\n    return true;'
          assert old_disable in mm, "old_disable tidak ditemukan!"
          mm = mm.replace(old_disable, new_disable, 1)
          open("src/mod/MyMod.cpp", "w").write(mm)

          # 3. Ganti #include <pl/Platform.hpp> dengan POSIX socket 127.0.0.1 di Engine.cpp
          eng = open("src/lyrics/Engine.cpp").read()
          socket_helper = """#include <arpa/inet.h>
          #include <netinet/in.h>
          #include <sys/socket.h>
          #include <sys/time.h>
          #include <unistd.h>

          namespace {
          struct LocalHttpResp { int status = 0; std::string body; bool ok() const { return status >= 200 && status < 300; } };
          LocalHttpResp localHttpGet(int port, const std::string& path, int timeoutMs) {
              LocalHttpResp res;
              int fd = ::socket(AF_INET, SOCK_STREAM, 0);
              if (fd < 0) return res;
              timeval tv{timeoutMs / 1000, (timeoutMs % 1000) * 1000};
              ::setsockopt(fd, SOL_SOCKET, SO_RCVTIMEO, &tv, sizeof(tv));
              ::setsockopt(fd, SOL_SOCKET, SO_SNDTIMEO, &tv, sizeof(tv));
              sockaddr_in addr{}; addr.sin_family = AF_INET; addr.sin_port = htons(static_cast<uint16_t>(port));
              ::inet_pton(AF_INET, "127.0.0.1", &addr.sin_addr);
              if (::connect(fd, reinterpret_cast<sockaddr*>(&addr), sizeof(addr)) < 0) { ::close(fd); return res; }
              std::string req = "GET " + path + " HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n";
              ::send(fd, req.data(), req.size(), 0);
              std::string raw; char buf[1024]; ssize_t n;
              while ((n = ::recv(fd, buf, sizeof(buf), 0)) > 0) raw.append(buf, n);
              ::close(fd);
              auto hdrEnd = raw.find("\\r\\n\\r\\n");
              if (hdrEnd == std::string::npos) return res;
              if (raw.find("200 OK") != std::string::npos && raw.find("200 OK") < hdrEnd) res.status = 200;
              res.body = raw.substr(hdrEnd + 4);
              return res;
          }
          } // namespace
          """
          eng = eng.replace("#include <pl/Platform.hpp>", socket_helper)
          eng = eng.replace('pl::platform::httpGet("http://127.0.0.1:" + std::to_string(port) + "/lyrics", 2500)', 'localHttpGet(port, "/lyrics", 2500)')
          eng = eng.replace('pl::platform::httpGet("http://127.0.0.1:" + std::to_string(port) + "/now", 1200)', 'localHttpGet(port, "/now", 1200)')

          # 4. Hapus baris .config("port",...) yang memakai ConfigType::Text
          eng = re.sub(r'[ \t]*\.config\("port"[^\n]*\n', '', eng)
          open("src/lyrics/Engine.cpp", "w").write(eng)
          EOF

      - name: Install Android build tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build packages
        shell: pwsh
        run: ./scripts/package.ps1 -Abi all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kangetsu-lyrics-levipack
          path: build-*/*.levipack

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-*/*.levipack
