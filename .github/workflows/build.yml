name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Kangetsu Lyrics patch from kangetsu.zip
        run: |
          unzip -q kangetsu.zip
          mkdir -p src/lyrics
          cp -r kangetsu/mod/src/lyrics/* src/lyrics/
          cp kangetsu/assets/lyrics.ttf .

          python3 -c '
          # 1. Patch CMakeLists.txt
          cm = open("CMakeLists.txt").read()
          cm = cm.replace("set(MOD_ID \"clange_me\"", "set(MOD_ID \"kangetsu_lyrics_port\"")
          cm = cm.replace("set(MOD_NAME \"Clange Me Mod\"", "set(MOD_NAME \"Kangetsu Lyrics (port)\"")
          cm = cm.replace("set(MOD_LIBRARY_NAME \"clange_me\"", "set(MOD_LIBRARY_NAME \"kangetsu_lyrics_port\"")
          cm = cm.replace("set(MOD_MINECRAFT_VERSIONS \"[\\\"1.26.*\\\"]\"", "set(MOD_MINECRAFT_VERSIONS \"[]\"")
          cm = cm.replace("src/mod/MyMod.cpp", "src/mod/MyMod.cpp\n    src/lyrics/Engine.cpp")
          open("CMakeLists.txt", "w").write(cm)

          # 2. Patch src/mod/MyMod.cpp pada fungsi enable() dan disable()
          mm = open("src/mod/MyMod.cpp").read()
          mm = "#include \"../lyrics/Engine.hpp\"\nnamespace { kl::Engine gLyrics; }\n" + mm
          old_enable = """    self.getLogger().info("Config message: {}", mConfig.message);
              return true;"""
          new_enable = """    self.getLogger().info("Config message: {}", mConfig.message);
              return gLyrics.start(getSelf().getId(), getSelf().getResourceDir().string(),
                                   [this](const std::string& m) { getSelf().getLogger().info(m); });"""
          mm = mm.replace(old_enable, new_enable)

          old_disable = """    // Undo enable-time state here.
              return true;"""
          new_disable = """    gLyrics.stop();
              return true;"""
          mm = mm.replace(old_disable, new_disable)
          open("src/mod/MyMod.cpp", "w").write(mm)
          '

      - name: Install Android build tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build packages
        shell: pwsh
        run: ./scripts/package.ps1 -Abi all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kangetsu-lyrics-levipack
          path: build-*/*.levipack

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-*/*.levipack
